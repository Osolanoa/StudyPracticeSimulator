<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" preserveAspectRatio="xMidYMid slice">
<defs>
 <radialGradient id="cool"><stop stop-color="#1169b2" stop-opacity=".65"/><stop offset=".45" stop-color="#143c80" stop-opacity=".42"/><stop offset="1" stop-color="#00122b" stop-opacity="0"/></radialGradient>
 <radialGradient id="violet"><stop stop-color="#833ef0" stop-opacity=".5"/><stop offset=".48" stop-color="#592c99" stop-opacity=".32"/><stop offset="1" stop-color="#2a1459" stop-opacity="0"/></radialGradient>
 <radialGradient id="ember"><stop stop-color="#ff8e2e" stop-opacity=".46"/><stop offset=".5" stop-color="#dc4d24" stop-opacity=".23"/><stop offset="1" stop-color="#612c25" stop-opacity="0"/></radialGradient>
 <radialGradient id="starCore"><stop stop-color="#fff" stop-opacity="1"/><stop offset=".1" stop-color="#e7f0ff" stop-opacity=".9"/><stop offset=".45" stop-color="#a9bcff" stop-opacity=".38"/><stop offset="1" stop-color="#4545c1" stop-opacity="0"/></radialGradient>
 <radialGradient id="galaxyCore"><stop stop-color="#fff6eb"/><stop offset=".1" stop-color="#d1bdf7"/><stop offset=".33" stop-color="#8467c0" stop-opacity=".73"/><stop offset=".7" stop-color="#4a388d" stop-opacity=".20"/><stop offset="1" stop-color="#1e2d6b" stop-opacity="0"/></radialGradient>
 <linearGradient id="earthSea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#17456c"/><stop offset=".17" stop-color="#071d40"/><stop offset=".67" stop-color="#030b22"/><stop offset="1" stop-color="#010615"/></linearGradient>
 <linearGradient id="earthRim" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ebf8ff" stop-opacity=".88"/><stop offset=".2" stop-color="#59c5ff" stop-opacity=".98"/><stop offset=".61" stop-color="#0774ed" stop-opacity=".34"/><stop offset="1" stop-color="#143cc7" stop-opacity="0"/></linearGradient>
 <filter id="clouds" x="-40%" y="-60%" width="180%" height="220%">
  <feTurbulence type="fractalNoise" baseFrequency=".007 .022" numOctaves="5" seed="11" result="noise"/>
  <feDisplacementMap in="SourceGraphic" in2="noise" scale="72" xChannelSelector="R" yChannelSelector="G" result="displaced"/>
  <feGaussianBlur in="displaced" stdDeviation="16"/>
 </filter>
 <filter id="clouds2" x="-40%" y="-60%" width="180%" height="220%">
  <feTurbulence type="fractalNoise" baseFrequency=".012 .019" numOctaves="4" seed="5" result="noise"/>
  <feDisplacementMap in="SourceGraphic" in2="noise" scale="52" xChannelSelector="R" yChannelSelector="G" result="displaced"/>
  <feGaussianBlur in="displaced" stdDeviation="12"/>
 </filter>
 <filter id="glow"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="galaxyGlow" x="-120%" y="-120%" width="340%" height="340%">
  <feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
 </filter>
</defs>
<!-- soft diffuse galactic gas: independent atmospheric strata -->
<g filter="url(#clouds)" opacity=".83">
 <ellipse cx="170" cy="435" rx="430" ry="145" fill="url(#cool)"/>
 <ellipse cx="520" cy="465" rx="350" ry="100" fill="url(#cool)"/>
 <ellipse cx="1110" cy="385" rx="310" ry="135" fill="url(#violet)"/>
 <ellipse cx="1530" cy="424" rx="380" ry="140" fill="url(#ember)"/>
 <ellipse cx="810" cy="615" rx="440" ry="165" fill="url(#violet)"/>
</g>
<g filter="url(#clouds2)" opacity=".90">
 <ellipse cx="30" cy="475" rx="250" ry="60" fill="#0f5d9c" opacity=".65"/>
 <ellipse cx="244" cy="492" rx="210" ry="76" fill="#1b71b9" opacity=".52"/>
 <ellipse cx="512" cy="506" rx="200" ry="65" fill="#163c91" opacity=".43"/>
 <ellipse cx="1160" cy="500" rx="190" ry="65" fill="#653785" opacity=".43"/>
 <ellipse cx="1480" cy="480" rx="240" ry="65" fill="#b84d27" opacity=".54"/>
 <ellipse cx="1740" cy="490" rx="235" ry="75" fill="#e78129" opacity=".53"/>
 <ellipse cx="40" cy="835" rx="350" ry="130" fill="#164d92" opacity=".5"/>
 <ellipse cx="1550" cy="820" rx="350" ry="130" fill="#37589b" opacity=".6"/>
</g>
<!-- distant spiral galaxy with carefully subtle rings -->
<g transform="translate(1280 172) rotate(-26)" opacity=".90">
 <ellipse rx="107" ry="52" fill="url(#galaxyCore)" opacity=".74"/>
 <ellipse rx="79" ry="34" fill="none" stroke="#8a64d7" stroke-width="5" stroke-opacity=".56" filter="url(#galaxyGlow)"/>
 <ellipse rx="64" ry="24" fill="none" stroke="#ccb1ff" stroke-width="2.2" stroke-opacity=".8"/>
 <ellipse rx="40" ry="12" fill="none" stroke="#e9dcff" stroke-width="1.8" stroke-opacity=".68"/>
 <ellipse rx="22" ry="7" fill="#f5eafa" opacity=".85"/>
 <ellipse rx="12" ry="4" fill="#fff5e5" filter="url(#glow)"/>
 <path d="M-110 -3C-72 -57 48 -68 103 -25M-100 26C-64 65 58 65 117 10" fill="none" stroke="#565dc7" stroke-width="3" opacity=".42" filter="url(#glow)"/>
</g>
<!-- soft shooting star near galaxy -->
<g opacity=".86">
 <path d="M1337 252 1268 312" stroke="#81c6fb" stroke-width="2" filter="url(#glow)"/>
 <path d="M1337 252 1290 298" stroke="#d5f6ff" stroke-width="1"/>
 <circle cx="1337" cy="252" r="2.8" fill="#fff8e3" filter="url(#glow)"/>
</g>
<!-- illuminated Earth horizon crossing bottom of screen -->
<path d="M-140 1090 Q895 370 1940 1090 L1940 1230 -140 1230Z" fill="url(#earthSea)" opacity=".92"/>
<path d="M-140 1090 Q895 370 1940 1090" fill="none" stroke="#1b83fa" stroke-width="24" stroke-opacity=".12" filter="url(#glow)"/>
<path d="M-140 1090 Q895 370 1940 1090" fill="none" stroke="url(#earthRim)" stroke-width="6" filter="url(#glow)"/>
<path d="M-140 1098 Q895 378 1940 1098" fill="none" stroke="#7bdeff" stroke-width="2.2" stroke-opacity=".69"/>
<!-- faint landmass glow on night-side -->
<g fill="#f6a15a" opacity=".4" filter="url(#glow)">
 <circle cx="556" cy="923" r="2"/><circle cx="592" cy="907" r="1.9"/><circle cx="627" cy="878" r="1.3"/><circle cx="705" cy="868" r="2.8"/><circle cx="741" cy="852" r="1.7"/>
 <circle cx="855" cy="844" r="2.3"/><circle cx="903" cy="845" r="1.1"/><circle cx="952" cy="860" r="2.2"/><circle cx="1030" cy="872" r="2.1"/><circle cx="1123" cy="917" r="1.4"/>
 <circle cx="654" cy="962" r="1.2"/><circle cx="713" cy="940" r="1.5"/><circle cx="847" cy="916" r="1.2"/><circle cx="921" cy="935" r="2.1"/><circle cx="1039" cy="963" r="2.2"/>
</g>
</svg>