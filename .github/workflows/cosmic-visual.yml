name: Lightweight cosmic background QA
on:
  push:
    branches:
      - perf/single-space-background-light-parallax
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cosmic-lite-feature
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Check lightweight background and course navigation
        run: |
          mkdir -p visual-previews
          cat > /tmp/cosmic-lite-test.cjs <<'NODE'
          const { chromium } = require(process.cwd() + '/node_modules/playwright');
          const path = require('node:path');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            for (const [label, width, height] of [['desktop', 1792, 912], ['mobile', 390, 844]]) {
              const page = await browser.newPage({ viewport: { width, height }, deviceScaleFactor: 1, isMobile: label==='mobile', hasTouch: label==='mobile' });
              await page.addInitScript(() => {
                window.__rafCalls = 0;
                const original = window.requestAnimationFrame.bind(window);
                window.requestAnimationFrame = callback => {
                  window.__rafCalls++;
                  return original(callback);
                };
              });
              page.setDefaultTimeout(12000);
              const errors = [];
              page.on('pageerror', error => errors.push(String(error)));
              await page.goto('file://' + path.resolve('index.html'), { waitUntil: 'domcontentloaded' });
              await page.waitForSelector('.cosmos-course');
              await page.waitForTimeout(1250);

              const metrics = await page.evaluate(() => {
                const scene = document.getElementById('cosmic-scene');
                const starLayer = scene.querySelector('.cosmic-lite-stars');
                const photo = scene.querySelector('.cosmic-lite-photo');
                const title = document.querySelector('.cosmos-title-area h1');
                return {
                  heading: title?.textContent?.trim(),
                  courses: document.querySelectorAll('.cosmos-course').length,
                  starCount: starLayer.querySelectorAll('.cosmic-lite-star').length,
                  imgCount: scene.querySelectorAll('img').length,
                  canvasCount: scene.querySelectorAll('canvas').length,
                  planets: scene.querySelectorAll('.cosmic-sun,.cosmic-moon,.cosmic-earth-globe').length,
                  photo: getComputedStyle(photo).backgroundImage,
                  fontFamily: getComputedStyle(title).fontFamily,
                  cardStyle: getComputedStyle(document.querySelector('.cosmos-course')).backgroundImage,
                  horizontalOverflow: document.documentElement.scrollWidth > innerWidth,
                  rafCalls: window.__rafCalls
                };
              });
              const photoCheck = await page.evaluate(async () => {
                const style = getComputedStyle(document.querySelector('.cosmic-lite-photo')).backgroundImage;
                const match = style.match(/url\(["']?([^"')]+)["']?\)/);
                if (!match) return {loaded:false,reason:'missing background URL'};
                return await new Promise(resolve => {
                  const img = new Image();
                  const timeout = setTimeout(() => resolve({loaded:false,reason:'timeout',src:match[1]}),15000);
                  img.onload=()=>{clearTimeout(timeout);resolve({loaded:true,width:img.naturalWidth,height:img.naturalHeight,src:match[1]});};
                  img.onerror=()=>{clearTimeout(timeout);resolve({loaded:false,reason:'load error',src:match[1]});};
                  img.src=match[1];
                });
              });
              console.log(label,JSON.stringify(metrics),JSON.stringify(photoCheck),'errors',JSON.stringify(errors));
              if (metrics.courses!==2 || metrics.planets!==0 || metrics.imgCount!==0 ||
                  metrics.canvasCount!==0 || metrics.starCount!==(label==='desktop'?42:18) ||
                  !metrics.heading.includes('Study Practice Simulator') ||
                  !metrics.fontFamily.includes('Outfit') || metrics.horizontalOverflow ||
                  !metrics.photo.includes('eso1236c') || !photoCheck.loaded || errors.length) {
                process.exitCode=1;
              }
              if (label==='desktop') {
                await page.mouse.move(90,90);
                await page.waitForTimeout(310);
                const first=await page.locator('.cosmic-lite-stars').evaluate(el=>getComputedStyle(el).transform);
                await page.mouse.move(width-90,height-90);
                await page.waitForTimeout(310);
                const second=await page.locator('.cosmic-lite-stars').evaluate(el=>getComputedStyle(el).transform);
                const idleBefore=await page.evaluate(()=>window.__rafCalls);
                await page.waitForTimeout(900);
                const idleAfter=await page.evaluate(()=>window.__rafCalls);
                console.log('pointer-parallax',JSON.stringify({first,second,changed:first!==second,idleRafDelta:idleAfter-idleBefore}));
                if(first===second || idleAfter-idleBefore>2)process.exitCode=1;
              }
              await page.screenshot({path:'visual-previews/'+label+'.png',fullPage:true});
              if(label==='desktop') {
                await page.locator('[data-cosmic-course]').first().click();
                await page.waitForSelector('.shell');
                await page.locator('[data-view="practiceTests"]').first().click();
                const heading=await page.locator('#main h1').first().textContent();
                console.log('navigation',JSON.stringify({heading}));
                if(!/practice/i.test(heading||''))process.exitCode=1;
                await page.screenshot({path:'visual-previews/course-practice.png',fullPage:true});
              }
              await page.close();
            }
            await browser.close();
          })().catch(error=>{console.error(error);process.exitCode=1;});
          NODE
          node /tmp/cosmic-lite-test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cosmic-lite-browser-screenshots
          path: visual-previews/*.png
          if-no-files-found: warn
